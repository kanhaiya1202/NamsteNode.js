<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <input type="text">
    <button onclick="addTodo()">addTodo</button>
    <button onclick="deletelasttodo()">deletelasttodo</button>
    <button onclick="deletfirstTodo()">deletfirstTodo</button>
    <div id="todo"></div>


   <script>
        let todos = []
        function addTodo() {
            todos.push({
                title: document.querySelector("input").value
                
            })
            render()
        }

        function deletelasttodo(){
            todos.splice(todos.length - 1 , 1)
            render()
        }
        function deletfirstTodo(){
            todos.splice(0,1)
            render()
        }
        function deleteTodo(){
            const divelem =document.querySelector("#todosd")
            document.querySelector("#todo").removeChild(divelem)
            
        }
        function render() {
            const title = document.querySelector("input")
            const parent = document.querySelector("#todo").innerHTML = ""
          
            for (let i = 0; i < todos.length; i++) {
                const todo = todos[i]
                const div = document.createElement("div")
                div.setAttribute("id", "todosd")
                const h2 = document.createElement("h2")
                const button = document.createElement("button")
                button.setAttribute("onclick", "deleteTodo()")
                button.innerHTML = "Delete"
                h2.innerHTML = todo.title
                div.appendChild(h2)
                div.appendChild(button)
                document.querySelector("#todo").appendChild(div)

            }
        }
    </script>

</body>

</html>
